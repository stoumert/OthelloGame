image: gradle:9.1.0-jdk-lts-and-current-alpine

stages:
  - build
  - test

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle

build:
  stage: build
  script:
    gradle --build-cache build
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 week

test:
  stage: test
  script:
    gradle test jacocoTestReport
  artifacts:
    when: always
    paths:
      - build/jacocoHtml/
    expire_in: 1 week
